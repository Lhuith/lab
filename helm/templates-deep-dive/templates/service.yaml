{{- range $key, $svc := (.Values.services | default dict) }}
{{ include "templating-deep-dive.validators.service" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "templating-deep-dive.fullname" $ }}-{{ $key }}
  labels: {{ include "templating-deep-dive.selector.labels" $ | nindent 4 }}
spec:
  type: {{ .type }}
  selector: {{ include "templating-deep-dive.selector.labels" $ | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .port }} 
      targetPort: {{ $.Values.containerPort.http }}
{{- end }}
