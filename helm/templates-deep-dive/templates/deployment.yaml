apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "templating-deep-dive.fullname" . }}
  labels: {{ include "templating-deep-dive.selector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{ include "templating-deep-dive.selector.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "templating-deep-dive.selector.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
			 {{- with .Values.securityContext | default dict}}
          {{- if and (hasKey . "enabled") .enabled }}
          securityContext:
             runAsUser: {{ .runAsUser }}
             fsGroup: {{ .fsGroup }}
          {{- end -}}
			 {{- end -}}
          {{- if .Values.services | default dict | len }}
          ports:
            - containerPort: {{ .Values.containerPort.http }}
          {{- end -}}
